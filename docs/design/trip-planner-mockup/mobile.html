<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnam Trip Planner Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<style>
:root{
  --bg:#fbf8f3;--surface:#ffffff;--card:#f6f1e9;--line:#ece6db;--fg:#1f2933;--muted:#717880;
  --accent:#0f6b6e;--accent-bg:#e0f1ee;--on-accent:#ffffff;--primary:#0f6b6e;--on-primary:#ffffff;
  color-scheme:light;
  --shop-bg:#fbe6ef;--shop-fg:#8a2150;--food-bg:#fde9dc;--food-fg:#9a4313;
  --sight-bg:#e9e7fb;--sight-fg:#3f3a99;--cafe-bg:#fbf0cf;--cafe-fg:#7a5a07;--nature-bg:#dcf1e4;--nature-fg:#1f6a3e;
  --ok-bg:#e1f3e8;--ok-fg:#1d6a3a;--warn-bg:#fdeccf;--warn-fg:#8a5206;--hot-bg:#fde1dc;--hot-fg:#9b2a1a;
  --land:#eaf0e8;--sea:#a9d6ea;--sand:#f1e2b6;--park:#cde6cb;--road:#ffffff;--roadline:#d9e0da;--lbl:#5a6a64;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:#e8e2d6;color:var(--fg);font-family:var(--font-body);font-size:14px}
button{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke-width:2}
[hidden]{display:none!important}
.shop{background:var(--shop-bg);color:var(--shop-fg)}
.food{background:var(--food-bg);color:var(--food-fg)}
.sight{background:var(--sight-bg);color:var(--sight-fg)}
.cafe{background:var(--cafe-bg);color:var(--cafe-fg)}
.nature{background:var(--nature-bg);color:var(--nature-fg)}
.ai{background:var(--accent-bg);color:var(--accent)}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.phone{position:relative;width:390px;height:min(844px,100%);background:var(--bg);border-radius:48px;border:9px solid #1d2630;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(60,40,10,.3)}
.sb{flex:none;display:flex;justify-content:space-between;align-items:center;padding:12px 26px 2px;font-size:13px;font-weight:600;background:var(--surface)}
.sb span{display:inline-flex;gap:5px;align-items:center}
.sb svg.i{width:15px;height:15px}
.mh{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px 10px 16px;background:var(--surface)}
.lg{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tn{flex:1;min-width:0;margin-left:6px;line-height:1.25}
.tn b{display:block;font-family:var(--font-head);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn span{font-size:12px;color:var(--muted)}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative;cursor:pointer}
.ib svg.i{width:20px;height:20px}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#e0573b;border:2px solid var(--surface)}
.avb{width:36px;height:36px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.days{flex:none;position:relative;display:flex;gap:8px;overflow-x:auto;padding:6px 16px 12px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dcl{flex:none;align-self:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 6px}
.dcl:first-child{padding-left:0}
.dc{flex:none;border:0;background:var(--card);border-radius:14px;padding:7px 12px;text-align:left;min-width:96px;cursor:pointer;line-height:1.3}
.dc b{display:block;font-size:13px}
.dc small{display:block;font-size:11px;color:var(--muted);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc.on{background:var(--accent-bg);color:var(--accent)}
.dc.on small{color:var(--accent)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.map{position:relative;overflow:hidden;background:var(--land);flex:0 0 34%;margin:10px 12px 0;border-radius:26px;border:4px solid #fff;box-shadow:0 10px 26px rgba(70,50,20,.18),0 2px 6px rgba(70,50,20,.08);transition:flex-basis .28s ease,margin .28s ease,border-width .28s ease}
.body.full .map{flex-basis:0;margin-top:0;border-width:0;box-shadow:none}
.map svg.mapimg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pin svg.i{width:16px;height:16px}
.pin.on{z-index:3;box-shadow:0 0 0 3px var(--accent),0 2px 10px rgba(0,0,0,.4)}
.pl{position:absolute;left:40px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--surface);color:var(--fg);font-size:12px;font-weight:600;padding:4px 9px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:none}
.mtop{position:absolute;left:10px;top:10px;display:flex;gap:6px;align-items:center}
.mcity{background:var(--surface);padding:6px 11px;border-radius:16px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);display:inline-flex;gap:5px;align-items:center}
.mday{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.94);padding:6px 11px;border-radius:16px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);display:inline-flex;gap:6px;align-items:center}
.mtag{position:absolute;right:10px;bottom:8px;font-size:9px;color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:6px}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;margin-top:-14px;position:relative;z-index:2;box-shadow:0 -6px 20px rgba(60,40,10,.12)}
.grab{flex:none;padding:10px 0 6px;display:flex;justify-content:center;cursor:pointer}
.grab i{display:block;width:42px;height:5px;border-radius:3px;background:var(--line)}
.addfab{position:absolute;right:16px;bottom:16px;z-index:3;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(15,107,110,.45);cursor:pointer}
.addfab svg.i{width:26px;height:26px}
.tb .avb{width:22px;height:22px;font-size:9px}
.addi.big{padding:0 14px}
.fab{position:absolute;left:14px;bottom:14px;z-index:3;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:20px;padding:9px 14px;background:var(--primary);color:var(--on-primary);font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.sc{flex:1;min-height:0;overflow:auto;padding:0 16px 96px;scrollbar-width:thin}
.dcity{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.h1{margin:2px 0 0;font-family:var(--font-head);font-size:24px;font-weight:700;letter-spacing:-0.01em}
.h1wrap{display:inline-flex;align-items:center;gap:8px;max-width:100%}
.h1in{font:inherit;color:var(--fg);border:0;background:transparent;padding:2px 8px;margin-left:-8px;border-radius:10px;outline:0;field-sizing:content;min-width:6ch;max-width:100%}
@supports not (field-sizing:content){.h1in{width:min(260px,60vw)}}
.h1in:focus{background:var(--card)}
.tag{display:inline-flex;align-items:center;color:var(--accent);background:var(--accent-bg);border-radius:9px;padding:5px 6px;flex:none}
.tag svg.i{width:12px;height:12px}
.dsub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:20px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;background:var(--primary);color:var(--on-primary)}
.btn.soft{background:var(--card);color:var(--fg)}
.btn.sm{padding:7px 12px;font-size:12px}
.dtop{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.pin.flip .pl{left:auto;right:40px}
.btn.wide{width:100%;margin-top:14px;padding:13px}
.list{margin-top:14px}
.card{position:relative;display:grid;grid-template-columns:1fr 76px;grid-template-areas:"c1 c1" "t p" "d p" "chs chs" "warn warn";column-gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 12px 14px;box-shadow:0 1px 2px rgba(20,30,40,.05)}
.card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.c1{grid-area:c1;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.when{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:16px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
.when svg.i{width:13px;height:13px}
.sq{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
.sq:disabled{opacity:.3}
.mv{display:inline-flex;gap:4px}
.mv .sq{background:var(--card);color:var(--fg)}
.t{grid-area:t;display:flex;gap:10px;align-items:center;font-family:var(--font-head);font-weight:700;font-size:16px;line-height:1.25}
.ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.d{grid-area:d;color:var(--muted);font-size:13px;line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph{grid-area:p;width:76px;height:76px;border-radius:14px;overflow:hidden;background:var(--card)}
.ph svg{width:100%;height:100%;display:block}
.chs{grid-area:chs;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ch{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:13px;padding:4px 9px;font-size:12px;font-weight:500;background:var(--card);color:var(--fg)}
.ch svg.i{width:12px;height:12px}
.ch.hot{background:var(--hot-bg);color:var(--hot-fg)}
.ch.amber{background:var(--warn-bg);color:var(--warn-fg)}
.ch.ghost{background:transparent;border:1px dashed var(--muted);color:var(--muted);cursor:pointer}
.warnbar{grid-area:warn;display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:8px 11px;border-radius:12px;background:var(--warn-bg);color:var(--warn-fg);font-size:12.5px;line-height:1.45}
.warnbar svg.i{margin-top:2px}
.leg{display:flex;align-items:center;min-height:34px;margin-left:27px;border-left:2px dotted var(--line);padding-left:16px}
.lt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);border:0;background:transparent;padding:6px 0;cursor:pointer}
.lt svg.i{width:14px;height:14px}
.aibadge{display:inline-flex;align-items:center;color:var(--accent);background:var(--accent-bg);border-radius:8px;padding:2px 5px}
.aibadge svg.i{width:11px;height:11px}
.empty{padding:20px;border-radius:16px;background:var(--card);color:var(--muted);line-height:1.5}
.sub{color:var(--muted);font-size:12px}
.recs{margin-top:26px}
.recs h2{margin:0;font-family:var(--font-head);font-size:17px;display:flex;gap:8px;align-items:center}
.rcs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -16px 0;padding:2px 16px 10px;scrollbar-width:none}
.rc{flex:0 0 236px;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px}
.rcp{border-radius:14px;overflow:hidden;height:92px;position:relative}
.rcp svg{width:100%;height:100%;display:block}
.rcb{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.94);color:var(--accent);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.rcb svg.i{width:11px;height:11px}
.rcn{font-family:var(--font-head);font-weight:700;font-size:15px;padding:0 2px}
.rcd{color:var(--muted);font-size:12.5px;line-height:1.45;padding:0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.rc .chs{margin:0;padding:0 2px}
.rca{margin-top:auto}
.addbar{flex:none;display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.addi{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;color:var(--muted);min-width:0}
.addi input{flex:1;min-width:0;height:42px;border:0;background:transparent;font:inherit;font-size:14px;color:var(--fg);outline:0}
.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 12px}
.tb{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;cursor:pointer}
.tb svg.i{width:22px;height:22px}
.tb.on{color:var(--accent);font-weight:600}
.modal{position:absolute;inset:0;background:rgba(20,25,30,.42);display:flex;align-items:flex-end;z-index:20}
.ms{width:100%;max-height:84%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:0 16px 22px;box-sizing:border-box}
.mt{margin:4px 0 8px;font-family:var(--font-head);font-size:17px;display:flex;gap:10px;align-items:center}
.mrow{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;border:0;background:transparent;padding:12px 4px;font-size:14px;text-align:left;cursor:pointer;color:var(--fg);border-bottom:1px solid var(--line)}
.mrow.sel{color:var(--accent);font-weight:600}
.mrow.link{color:var(--fg)}
.mrow.danger{color:var(--hot-fg)}
.mrow .sub{margin-left:auto}
.mrow label{flex:1}
.mrow input{width:96px;height:36px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:0 8px}
.mrow input[type=number]{width:76px}
.ainote{display:flex;gap:8px;align-items:center;color:var(--accent);background:var(--accent-bg);border-radius:12px;padding:8px 12px;font-size:12.5px;margin-bottom:4px}
.mlabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.mchips{display:flex;gap:8px;flex-wrap:wrap}
.mchip{border:0;background:var(--card);border-radius:14px;padding:8px 12px;font-size:13px;cursor:pointer;text-align:left;line-height:1.3}
.mchip small{display:block;color:var(--muted);font-size:11px}
.who{display:flex;gap:12px;align-items:center;padding:6px 4px 12px}
.who b{font-family:var(--font-head);font-size:16px}
.toast{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:9px 15px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
@media (max-width:500px){
  body{background:var(--bg)}
  .stage{padding:0}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .sb{display:none}
  .mh{padding-top:12px}
}
@media (prefers-reduced-motion:reduce){.map,.toast{transition:none}}
</style>
</head>

<div class="stage">
 <div class="phone" id="phone">
  <div class="sb" aria-hidden="true"><span>9:41</span><span><i data-lucide="signal" class="i"></i><i data-lucide="wifi" class="i"></i><i data-lucide="battery-full" class="i"></i></span></div>
  <header class="mh">
   <span class="lg"><i data-lucide="compass" class="i" aria-hidden="true"></i></span>
   <div class="tn"><b>Vietnam with friends</b><span>12 to 19 May · 3 travelers</span></div>
   <button class="ib" data-a="soon" aria-label="Invite travelers"><i data-lucide="user-plus" class="i" aria-hidden="true"></i></button>
   <button class="ib" data-a="soon" aria-label="Notifications"><i data-lucide="bell" class="i" aria-hidden="true"></i><span class="dot"></span></button>
     </header>
  <div class="days" id="days"></div>
  <div class="body" id="bodyArea">
   <section class="map" id="map" aria-label="Map of the planned stops"></section>
   <section class="sheet" id="sheet">
    <div class="grab" data-a="grab" role="button" tabindex="0" aria-label="Show more or less of the list"><i></i></div>
    <div class="sc" id="sc"></div>
    <button class="fab" id="fab" data-a="grab" hidden><i data-lucide="map" class="i" aria-hidden="true"></i>Map</button>
    <button class="addfab" data-a="addopen" aria-label="Add a place"><i data-lucide="plus" class="i" aria-hidden="true"></i></button>
   </section>
  </div>
  <nav class="tabs" aria-label="Main">
   <button class="tb on"><i data-lucide="luggage" class="i" aria-hidden="true"></i>My trips</button>
   <button class="tb" data-a="soon"><i data-lucide="compass" class="i" aria-hidden="true"></i>Discover</button>
   <button class="tb" data-a="soon"><i data-lucide="ticket" class="i" aria-hidden="true"></i>Bookings</button>
   <button class="tb" data-a="soon"><i data-lucide="lightbulb" class="i" aria-hidden="true"></i>Inspiration</button>
   <button class="tb" data-a="acct" aria-label="Profile and settings"><span class="avb sight">EK</span>Profile</button>
  </nav>
  <div id="modalHost"></div>
  <div class="toast" id="toast" role="status"></div>
 </div>
</div>

 var w=dow(d),h=s.hours;

 if(!h)return '';
 if(h.closed&&h.closed.indexOf(w)>-1)return 'Closed on '+DOWS[w]+'s';

 });
 return h;
}
function sheetHtml(){
 var d=DAYS[cur],tm=0;
 d.legs.forEach(function(g,li){if(!g.hidden)tm+=legMin(d,li);});
 var sub=longDay(d)+(d.stops.length?' · '+d.stops.length+(d.stops.length===1?' place':' places'):'')+(d.stops.length>1?' · about '+tm+' min travel':'');
 var h='<div class="dh"><div class="dtop"><span class="dcity">'+ic('map-pin')+CITIES[d.city].name+'</span>'+(d.stops.length>1?'<button class="btn soft sm" data-a="reorder">'+ic('arrow-up-down')+(reorder?'Done':'Reorder')+'</button>':'')+'</div><h1 class="h1"><label class="h1wrap"><input id="dayTitle" class="h1in" type="text" value="'+esc(dayTitle(d))+'" placeholder="Name this day" aria-label="Day title" maxlength="40"><span class="tag" title="Suggested by AI" aria-label="Suggested by AI"'+(d.title?' hidden':'')+'>'+ic('sparkles')+'</span></label></h1><div class="dsub">'+sub+'</div>'+'</div><div class="list">';
 d.stops.forEach(function(s,i){h+=cardHtml(s,i,d);if(i<d.stops.length-1)h+=legHtml(cur,i);});
 if(!d.stops.length)h+='<div class="empty"><b>Nothing planned yet.</b><br>Add a place below, or pick one of the AI recommendations.</div>';
 return h+'</div>'+recsHtml(d);
}
function modalHtml(){
 if(!modal)return '';
 var inner='';
 if(modal.t==='acct'){
  var rows=[['user','Profile',''],['settings','Account settings',''],['bell','Notifications',''],['languages','Language and currency','English · VND'],['circle-help','Help','']];
  inner='<div class="grab" data-a="close"><i></i></div><div class="who"><span class="avb sight">EK</span><div><b>Eugen</b><div class="sub">Trip member</div></div></div>';
  rows.forEach(function(r){inner+='<button class="mrow" data-a="soon">'+ic(r[0])+r[1]+(r[2]?'<span class="sub">'+r[2]+'</span>':'')+'</button>';});
  inner+='<button class="mrow" data-a="soon">'+ic('log-out')+'Sign out</button>';
 }else if(modal.t==='add'){
  inner='<div class="grab" data-a="close"><i></i></div><h3 class="mt">Add a place</h3><div class="sub" style="margin-bottom:12px">To '+esc(dayTitle(DAYS[cur]))+' · '+shortDay(DAYS[cur])+'</div><label class="addi big" for="addIn">'+ic('map-pin')+'<input id="addIn" type="text" placeholder="Search or type a place name" autocomplete="off"></label><button class="btn wide" data-a="addgo">Add to day</button>';
 }else if(modal.t==='leg'){
  var d=DAYS[modal.di],g=d.legs[modal.li],a=d.stops[modal.li],b=d.stops[modal.li+1],inf=legInfo(d,modal.li),m=legMode(d,modal.li),mins=legMin(d,modal.li);
  inner='<div class="grab" data-a="close"><i></i></div><h3 class="mt">'+esc(a.n)+' → '+esc(b.n)+'</h3>';
  if(g.auto)inner+='<div class="ainote">'+ic('sparkles')+'Best option, chosen by AI</div>';
  Object.keys(MODES).forEach(function(mm){inner+='<button class="mrow'+(mm===m?' sel':'')+'" data-a="mode" data-m="'+mm+'">'+ic(MODES[mm].i)+MODES[mm].l+'<span class="sub">'+inf.t[mm]+' min</span>'+(mm===m?ic('check'):'')+'</button>';});
  if(!g.auto)inner+='<button class="mrow link sel" data-a="auto">'+ic('sparkles')+'Use the AI choice again</button>';
  inner+='<div class="mrow">'+ic('timer')+'<label for="du">Travel time</label><input id="du" type="number" min="1" max="600" data-a="dur" value="'+mins+'"><span class="sub" style="margin-left:0">min</span></div>';
  if(g.dur!=null)inner+='<button class="mrow link" data-a="rdur">'+ic('rotate-ccw')+'Reset to estimated '+inf.t[m]+' min</button>';
  inner+='<div class="mrow">'+ic('clock')+'<label for="tm">Leave at</label><input id="tm" type="time" data-a="time" value="'+g.time+'"></div>';
  inner+='<button class="mrow link" data-a="upl">'+ic('upload')+(g.ticket?'<span style="flex:1">'+esc(g.ticket)+'</span><span data-a="rmt" aria-label="Remove ticket">'+ic('x')+'</span>':'Upload ticket')+'</button>';
  inner+='<button class="mrow link" data-a="hideleg">'+ic('eye-off')+'Hide directions</button><button class="btn wide" data-a="close">Done</button>';
 }else if(modal.t==='place'){
  var dd=DAYS[cur],s=dd.stops[modal.i];
  if(!s)return '';
  var w=check(s,dd);
  inner='<div class="grab" data-a="close"><i></i></div><h3 class="mt"><span class="ic '+s.c+'">'+ic(s.i)+'</span>'+esc(s.n)+'</h3>';
  inner+='<div class="mrow">'+ic('clock')+'<label for="st">Start time</label><input id="st" type="time" data-a="stime" value="'+s.time+'"></div>';
  if(w)inner+='<div class="warnbar" style="margin:10px 0">'+ic('triangle-alert')+'<span><b>Heads up:</b> '+w+'. Pick another day or time?</span></div>';
  inner+='<div class="mrow">'+ic('ticket')+'<label for="co">Entry cost</label><input id="co" type="number" min="0" data-a="cost" placeholder="0" value="'+(s.cost==null?'':s.cost)+'"><span class="sub" style="margin-left:0">k VND</span></div>';
  var chips='';
  DAYS.forEach(function(x,i){if(i!==cur&&x.city===dd.city)chips+='<button class="mchip" data-a="moveto" data-i="'+i+'"><b>'+shortDay(x)+'</b><small>'+esc(dayTitle(x))+'</small></button>';});
  if(chips)inner+='<div class="mlabel">Move to another day</div><div class="mchips">'+chips+'</div>';
  inner+='<button class="mrow danger" style="margin-top:10px" data-a="remove">'+ic('trash-2')+'Remove from this day</button><button class="btn wide" data-a="close">Done</button>';
 }
 return '<div class="modal" data-a="scrim"><div class="ms" role="dialog" aria-modal="true">'+inner+'</div></div>';
}
function mapBuild(animate){
 var el=document.getElementById('map'),r=el.getBoundingClientRect();
 if(r.width<10||r.height<40)return;
 var d=DAYS[cur],c=CITIES[d.city],tv=viewFor(d,c,r.width,r.height);
 var from=(animate&&curCity===d.city&&curV)?curV:tv;
 var m='<svg class="mapimg" viewBox="0 0 '+c.W+' '+c.H+'" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of '+c.name+'">'+(c.kind==='img'?'<image href="map.webp" x="0" y="0" width="'+c.W+'" height="'+c.H+'"/>':artDaNang());
 if(d.stops.length>1){var pts=d.stops.map(function(s){return s.x+','+s.y;}).join(' ');
  m+='<polyline points="'+pts+'" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><polyline points="'+pts+'" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="9 7" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';}
 m+='</svg>';
 d.stops.forEach(function(s,i){m+='<div class="pin '+s.c+(i===sel?' on':'')+'" data-a="stop" data-i="'+i+'" data-x="'+s.x+'" data-y="'+s.y+'" role="button" tabindex="0" aria-label="'+esc(s.n)+'">'+ic(s.i)+(i===sel?'<span class="pl">'+esc(s.n)+'</span>':'')+'</div>';});
 var tm=0;d.legs.forEach(function(g,li){if(!g.hidden)tm+=legMin(d,li);});
 m+='<div class="mtop"><span class="mcity">'+ic('map-pin')+c.name+'</span>'+(zoom?'<button class="mcity" data-a="showall" style="border:0;cursor:pointer">'+ic('scan')+'Show all</button>':'')+'</div>';
 m+='<span class="mday">'+ic('route')+d.stops.length+(d.stops.length===1?' place':' places')+(tm?' · '+tm+' min':'')+'</span><span class="mtag">'+(c.kind==='img'?'Map preview':'Illustrated map')+'</span>';
 el.innerHTML=m;
 curCity=d.city;
 applyView(from);
 if(animate&&from!==tv)tween(from,tv);else if(!animate)applyView(tv);
}
function render(){
 var sc=document.getElementById('sc'),st=sc.scrollTop;
 document.getElementById('days').innerHTML=daysHtml();
 sc.innerHTML=sheetHtml();
 sc.scrollTop=st;
 document.getElementById('bodyArea').classList.toggle('full',sheetFull);
 document.getElementById('fab').hidden=!sheetFull;
 document.getElementById('modalHost').innerHTML=modalHtml();
 var ai=document.getElementById('addIn');if(ai&&modal&&modal.t==='add')ai.focus();
 mapBuild(true);
 if(window.lucide)lucide.createIcons();
 var a=document.querySelector('.dc.on');if(a){var c=a.parentNode;c.scrollLeft=a.offsetLeft-c.clientWidth/2+a.clientWidth/2;}
 if(scrollSel){var cd=document.querySelector('.card.on');if(cd)cd.scrollIntoView({block:'nearest',behavior:'smooth'});scrollSel=false;}
}
var lockUntil=0,lastTop=0,touchY=null,scEl=document.getElementById('sc');
function setFull(v){
 if(sheetFull===v)return;
 sheetFull=v;lockUntil=Date.now()+500;
 document.getElementById('bodyArea').classList.toggle('full',v);
 document.getElementById('fab').hidden=!v;
 setTimeout(function(){mapBuild(false);if(window.lucide)lucide.createIcons();},320);
}
scEl.addEventListener('scroll',function(){
 var top=scEl.scrollTop;
 if(Date.now()<lockUntil){lastTop=top;return;}
 var extra=document.getElementById('map').getBoundingClientRect().height+24;
 if(!sheetFull&&top>lastTop&&top>28&&scEl.scrollHeight-scEl.clientHeight>extra+40)setFull(true);
 lastTop=top;
});
scEl.addEventListener('wheel',function(e){if(sheetFull&&e.deltaY<0&&scEl.scrollTop<=0&&Date.now()>lockUntil)setFull(false);},{passive:true});
scEl.addEventListener('touchstart',function(e){touchY=e.touches[0].clientY;},{passive:true});
scEl.addEventListener('touchmove',function(e){if(sheetFull&&touchY!==null&&scEl.scrollTop<=0&&e.touches[0].clientY-touchY>24&&Date.now()>lockUntil){setFull(false);touchY=null;}},{passive:true});
var phone=document.getElementById('phone');
phone.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t)return;
 var a=t.dataset.a,d=DAYS[cur];
 if(a==='scrim'&&e.target!==t)return;
 if(a==='time'||a==='stime'||a==='cost'||a==='dur')return;
 var g=null;
 if(modal&&modal.t==='leg')g=DAYS[modal.di].legs[modal.li];
 if(a==='day'){cur=+t.dataset.i;sel=0;zoom=false;reorder=false;setFull(false);}
 else if(a==='stop'){sel=+t.dataset.i;zoom=true;scrollSel=t.classList.contains('pin');}
 else if(a==='edit'){modal={t:'place',i:+t.dataset.i};}
 else if(a==='up'||a==='down'){var i=+t.dataset.i,j=a==='up'?i-1:i+1;if(d.stops[j]){var x=d.stops[i];d.stops[i]=d.stops[j];d.stops[j]=x;sel=j;}}
 else if(a==='reorder'){reorder=!reorder;}
 else if(a==='leg'){modal={t:'leg',di:cur,li:+t.dataset.li};}
 else if(a==='showleg'){d.legs[+t.dataset.li].hidden=false;}
 else if(a==='grab'){setFull(!sheetFull);return;}
 else if(a==='showall'){zoom=false;}
 else if(a==='acct'){modal={t:'acct'};}
 else if(a==='addopen'){modal={t:'add'};}
 else if(a==='addgo'){addPlace();return;}
 else if(a==='close'||a==='scrim'){modal=null;}
 else if(a==='mode'&&g){g.m=t.dataset.m;g.auto=false;g.dur=null;}
 else if(a==='auto'&&g){g.auto=true;g.dur=null;}
 else if(a==='rdur'&&g){g.dur=null;}
 else if(a==='hideleg'&&g){g.hidden=true;modal=null;}
 else if(a==='upl'&&g){upLeg=g;document.getElementById('fileIn').click();return;}
 else if(a==='rmt'&&g){g.ticket='';e.stopPropagation();}
 else if(a==='moveto'){var td=+t.dataset.i,it=d.stops.splice(modal.i,1)[0];DAYS[td].stops.push(it);normLegs(d);normLegs(DAYS[td]);sel=Math.max(0,Math.min(sel,d.stops.length-1));modal=null;toast('Moved to '+shortDay(DAYS[td]));}
 else if(a==='remove'){d.stops.splice(modal.i,1);normLegs(d);sel=Math.max(0,Math.min(sel,d.stops.length-1));modal=null;zoom=false;toast('Place removed');}
 else if(a==='addsug'){var s=d.sugg.splice(+t.dataset.i,1)[0];pushStop(JSON.parse(JSON.stringify(s)));toast('Added to this day');}
 else if(a==='soon'){toast('Not part of this mockup yet');return;}
 render();
});
phone.addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&(e.target.classList.contains('pin')||e.target.classList.contains('grab'))){e.preventDefault();e.target.click();}
 if(e.target.id==='dayTitle'&&e.key==='Enter')e.target.blur();
 if(e.target.id==='addIn'&&e.key==='Enter')addPlace();
});
phone.addEventListener('input',function(e){
 var t=e.target;if(t.id!=='dayTitle')return;
 var d=DAYS[cur],v=t.value.trim();
 d.title=(v===''||v===autoTitle(d))?'':v;
 var tag=t.parentNode.querySelector('.tag');if(tag)tag.hidden=!!d.title;
 var dc=document.querySelector('.dc.on small');if(dc)dc.textContent=dayTitle(d);
});
phone.addEventListener('change',function(e){
 var t=e.target,a=t.dataset&&t.dataset.a,d=DAYS[cur];
 if(t.id==='dayTitle'){render();return;}
 if(!a)return;
 if(a==='time'&&modal&&modal.t==='leg'){DAYS[modal.di].legs[modal.li].time=t.value;}
 else if(a==='dur'&&modal&&modal.t==='leg'){DAYS[modal.di].legs[modal.li].dur=t.value===''?null:Math.max(1,Math.round(+t.value));}
 else if(a==='stime'&&modal&&modal.t==='place'){if(t.value)d.stops[modal.i].time=t.value;}
 else if(a==='cost'&&modal&&modal.t==='place'){d.stops[modal.i].cost=t.value===''?null:Math.max(0,+t.value);}
 render();
});
function addPlace(){
 var inp=document.getElementById('addIn'),name=inp.value.trim();
 if(!name){toast('Enter a place name');return;}
 var c=CITIES[DAYS[cur].city];
 pushStop({c:'sight',i:'map-pin',n:name,desc:'Added just now. Tell the group why it’s worth a stop.',x:c.center[0]+(Math.random()-0.5)*c.W*0.2,y:c.center[1]+(Math.random()-0.5)*c.H*0.2,time:'12:00',hours:null,cost:null,by:'EK',ph:'sight'});
 inp.value='';modal=null;render();
 var sc=document.getElementById('sc');sc.scrollTop=sc.scrollHeight;
}
function applyView(v){
 curV=v;
 var el=document.getElementById('map'),svg=el.querySelector('svg.mapimg');
 if(!svg)return;
 svg.setAttribute('viewBox',v.x+' '+v.y+' '+v.w+' '+v.h);
 el.querySelectorAll('.pin').forEach(function(p){
  var l=(p.dataset.x-v.x)/v.w*100,t=(p.dataset.y-v.y)/v.h*100;
  p.style.left=l+'%';p.style.top=t+'%';
  p.classList.toggle('flip',l>52);
  p.style.visibility=(l<-4||l>104||t<-4||t>104)?'hidden':'visible';
 });
}
var fi=document.createElement('input');fi.type='file';fi.id='fileIn';fi.hidden=true;document.body.appendChild(fi);
fi.addEventListener('change',function(e){if(e.target.files[0]&&upLeg){upLeg.ticket=e.target.files[0].name;e.target.value='';render();}});
window.addEventListener('resize',function(){mapBuild(false);if(window.lucide)lucide.createIcons();});
render();
</script>
</body>
</html>
